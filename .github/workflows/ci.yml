name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show the interpreter version
        run: python --version

      - name: Byte-compile every source file
        run: python -m py_compile graphwright/*.py tests/test_graphwright.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the command line interface
        run: |
          python -m graphwright --version
          python -m graphwright show --path tests/fixtures/sample
          python -m graphwright build tests/fixtures/sample -o /tmp/graph.json
          python -m graphwright path build_engine Base.greet --graph /tmp/graph.json
